<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="atividade.js" defer></script>
    <title>Atividade avaliativa</title>
</head>
<body>
    <header>
        <h1>Atividade Avaliativa</h1>
    </header>
    <main>
        <h2>Cadastro de disciplina e Horas estudadas</h2>
        <form id =  "cadastroForm">
            <label for="disciplina">Disciplina:</label>
            <input type="text" id="disciplina" name="disciplina" required>

            <label for="horas">Horas estudadas:</label>
            <input type="number" id="horas" name="horas" required>
            <br><br>
            <button type="submit">Cadastrar</button>
        </form>
        <div>
            <h2>Disciplinas Cadastradas</h2>
            <ul id="disciplinasList"></ul>

        </div>
    </main>
    <footer>
        <p>Obrigado!</p>
    </footer>
</body>
</html>
